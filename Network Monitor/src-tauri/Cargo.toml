[package]
name = "omg-network-monitor"
version = "2.0.0"
description = "A native Windows network monitor"
authors = ["OMG Tools"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
dirs-next = "2.0"
dns-lookup = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

