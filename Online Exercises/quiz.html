<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11111b">
  <title>Online Exercises</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <link rel="stylesheet" href="common.css?v=20260724b">
  <link rel="stylesheet" href="quiz.css?v=20260725a">
</head>
<body>
  <canvas id="fireworkCanvas" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand ripple-button" href="index.html" aria-label="杩斿洖棰樼洰鍒楄〃">
      <img src="logo.svg" alt="">
      <span>Online Exercises</span>
    </a>
    <div class="topbar-actions" aria-label="页面操作">
      <button class="icon-button ripple-button" id="reloadButton" type="button" aria-label="重新载入题库" title="重新载入题库">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.1A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></svg>
      </button>
      <button class="icon-button ripple-button" id="focusButton" type="button" aria-label="进入专注模式" title="专注模式">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9H3V3h6v2H5v4Zm14-4h-4V3h6v6h-2V5ZM5 15v4h4v2H3v-6h2Zm14 4v-4h2v6h-6v-2h4Z"/></svg>
      </button>
    </div>
  </header>

  <main class="shell">
    <section id="progressSection" class="progress-section" aria-label="缁冧範杩涘害">
      <div class="progress-meta"><span id="progressText">准备中</span><span id="progressPercent">0%</span></div>
      <div class="progress-track"><span id="progressBar"></span></div>
    </section>

    <section id="questionHost" aria-live="polite">
      <article class="question-card skeleton-card">
        <span class="skeleton short"></span>
        <span class="skeleton wide"></span>
        <span class="skeleton wide"></span>
      </article>
    </section>

    <nav id="questionNav" class="question-nav" aria-label="棰樼洰鍒嗛〉">
      <button class="text-button ripple-button" id="prevButton" type="button">上一题</button>
      <div class="nav-actions">
        <button class="text-button secondary ripple-button" id="resetButton" type="button">重置本题</button>
        <button class="filled-button next ripple-button hidden" id="nextButton" type="button">下一题</button>
      </div>
    </nav>

    <section id="resultView" class="result-view hidden" aria-live="polite"></section>
  </main>

  <div id="snackbar" class="snackbar" role="status" aria-live="assertive"></div>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
  <script src="common.js?v=20260724b"></script>
  <script src="quiz.js?v=20260725a"></script>
  <script src="results-redirect.js"></script>
</body>
</html>
